<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Manrope';font-weight:200 800;src:url(manrope-latin-wght-normal.woff2)}
@font-face{font-family:'JBM';font-weight:100 800;src:url(jetbrains-mono-latin-wght-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#f7f8fa;font-family:'Manrope',sans-serif;color:#16161a;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 40%,#ffffff 0%,#f5f6f8 60%,#e9ebef 100%)}
.wash{position:absolute;border-radius:50%;filter:blur(110px)}
#grad{position:absolute;inset:0;background:linear-gradient(125deg,#ff1f7a 0%,#ff4a55 48%,#ff7a12 100%);opacity:0}
#gradshine{position:absolute;inset:0;background:radial-gradient(60% 60% at 30% 25%,rgba(255,255,255,.35),transparent 70%)}
#wipe{position:absolute;border-radius:50%;left:0;top:0}
#stage{position:absolute;left:0;top:0;width:0;height:0}
.sc{position:absolute;left:0;top:0;width:0;height:0;display:none}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.t{white-space:nowrap;font-weight:700;letter-spacing:-.04em;line-height:1.02;text-align:center}
.w{display:inline-block;will-change:transform,opacity}
.pk{color:#ff1f7a}.wh{color:#fff}
.gt{background:linear-gradient(90deg,#ff1f7a,#ff7a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:'JBM',monospace;text-transform:uppercase;letter-spacing:.14em;font-weight:500;white-space:nowrap}
.card{background:#fff;border-radius:22px;box-shadow:0 2px 0 #fff inset,0 18px 40px rgba(22,22,26,.16),0 0 0 1.5px rgba(22,22,26,.06)}
.tile{width:300px;height:300px;border-radius:70px;background:linear-gradient(160deg,#ffffff,#ffe9f1);box-shadow:0 10px 0 rgba(120,10,50,.28),0 40px 70px rgba(90,10,30,.35),inset 0 3px 0 #fff;display:flex;align-items:center;justify-content:center}
.ico3{border-radius:30%;background:linear-gradient(150deg,#ff5a9c,#ff1f7a 45%,#ff7a12);box-shadow:0 .09em 0 #c2185b,0 .18em .3em rgba(194,24,91,.45),inset 0 .04em 0 rgba(255,255,255,.6);display:inline-flex;align-items:center;justify-content:center}
.pill{border-radius:999px;white-space:nowrap}
svg{display:block}
</style></head><body>
<div id="bg"><div class="wash" id="w1" style="background:#ff1f7a;opacity:.07"></div><div class="wash" id="w2" style="background:#ff7a12;opacity:.09"></div></div>
<div id="grad"><div id="gradshine"></div></div>
<div id="wipe"></div>
<div id="stage"></div>
<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),L=(a,b,p)=>a+(b-a)*p;
const E={out:x=>1-Math.pow(1-x,3),expo:x=>x>=1?1:1-Math.pow(2,-10*x),in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  sp:x=>x<=0?0:x>=1?1:1-Math.cos(x*Math.PI*2.4)*Math.exp(-x*5.5),back:x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}};
const P=(t,a,d)=>cl((t-a)/d);
const FMT=(location.hash||'#h').slice(1);const [W,H]={h:[1920,1080],v:[1080,1920],s:[1080,1080]}[FMT];
document.documentElement.style.cssText=document.body.style.cssText=`width:${W}px;height:${H}px`;
const V=FMT=='v';const KS={h:1.3,v:1.22,s:.86}[FMT],YY={h:.8,v:1.12,s:1}[FMT],WS=W/KS,HS=H/KS;const stage=document.getElementById('stage');
const $=id=>document.getElementById(id),$$=(q,r=document)=>[...r.querySelectorAll(q)];
const w1=$('w1'),w2=$('w2');w1.style.cssText+=`width:${W*.7}px;height:${W*.7}px`;w2.style.cssText+=`width:${W*.6}px;height:${W*.6}px`;
// place element centred at (x,y) in stage coords
function T(el,x,y,o={}){if(typeof el=='string')el=$(el);el.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,0) ${o.p?`perspective(${o.p}px)`:''} rotateY(${o.ry||0}deg) rotateX(${o.rx||0}deg) rotate(${o.r||0}deg) scale(${o.s??1}${o.sy!=null?','+o.sy:''})`;
  if(o.o!=null)el.style.opacity=o.o;el.style.filter=o.b>.3?`blur(${o.b.toFixed(1)}px)`:'none';if(o.z!=null)el.style.zIndex=o.z}
const sc=(id,html)=>{const d=document.createElement('div');d.className='sc';d.id=id;d.innerHTML=html;stage.appendChild(d);return d};
const txt=(id,s,size,cls='')=>`<div class="a t ${cls}" id="${id}" style="font-size:${size}px">${s.split('|').map(l=>l.split(' ').map(w=>{if(w[0]=='*')txt.on=1;const h=`<span class="w${txt.on?' pk':''}">${w.replace(/\*/g,'')}</span>`;if(w.endsWith('*'))txt.on=0;return h}).join(' ')).join('<br>')}</div>`;
// word pop: spring in, shrink/blur out
function words(id,t,t0,tOut,st=.09){$$('.w',$(id)).forEach((w,i)=>{const p=P(t,t0+i*st,.55),e=E.sp(p),q=tOut==null?0:E.in(P(t,tOut+i*.025,.28));
  w.style.opacity=cl(p*3)*(1-q);w.style.transform=`translateY(${(1-e)*70-q*50}px) rotate(${(1-e)*-6}deg) scale(${L(.6,1,e)*(1-q*.3)})`;w.style.filter=q>0?`blur(${q*10}px)`:'none'})}
const GEM=(s,c1='#ff1f7a',c2='#ff7a12')=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path class="g1" d="M18 6 L46 6 L60 27 L4 27 Z" fill="${c1}"/><path class="g2" d="M4 31 L60 31 L32 60 Z" fill="${c2}"/></svg>`;
const I={ // white glyph icons 24x24
 search:'<circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15 15l5.5 5.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>',
 refresh:'<path d="M19 12a7 7 0 1 1-2.2-5.1" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 3.5v4.6h-4.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
 code:'<path d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
 embed:'<circle cx="12" cy="8" r="3.6" fill="currentColor"/><path d="M4.5 20c0-4.2 3.3-6.6 7.5-6.6s7.5 2.4 7.5 6.6z" fill="currentColor"/>',
 cal:'<rect x="3.5" y="5.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M3.5 10.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
 coin:'<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><text x="12" y="16.4" font-size="11" font-weight="800" text-anchor="middle" fill="currentColor" font-family="Manrope">R</text>',
 doc:'<path d="M6 3.5h8l4.5 4.5v12.5H6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M9 12h6M9 16h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 eye:'<path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="2.3"/><circle cx="12" cy="12" r="3" fill="currentColor"/>',
 hand:'<path d="M3 8l4.5-3.5 4.5 2.5 4.5-2.5L21 8v8l-4.5 3.5-4.5-2.5L7.5 19.5 3 16z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>',
 heart:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.500 10c0 5.400-7.500 10-7.500 10z" fill="currentColor"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.500" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
 x:'<path d="M6.500 6.500l11 11M17.500 6.500l-11 11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>'};
const ico=(n,s,col='#fff')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="color:${col}">${I[n]}</svg>`;

// ================= scenes =================
// A: logo open
sc('A',`<div class="a" id="Am">${GEM(260)}</div><div class="a" id="Aw" style="overflow:hidden;white-space:nowrap"><div id="Awi" style="display:inline-block"><div style="font-weight:800;font-size:150px;letter-spacing:.06em;line-height:1">GEMIS</div><div class="mono" style="font-size:38px;letter-spacing:.62em;margin-top:8px;color:#16161a">Studio</div></div></div>`);
// B/C: messy UI orbit
const FR=[`<div class="card" style="padding:16px 34px;font-weight:700;font-size:30px;background:#16161a;color:#fff">Submit</div>`,

 `<div class="card" style="padding:16px 24px;display:flex;gap:14px;align-items:center;font-weight:700;font-size:26px"><span style="width:40px;height:40px;border-radius:50%;background:#ff1f7a;display:flex;align-items:center;justify-content:center">${ico('x',24)}</span>Error 500</div>`,
 `<div class="card" style="padding:14px"><div style="width:110px;height:56px;border-radius:40px;background:#dcdee3;position:relative"><div style="position:absolute;left:6px;top:6px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25)"></div></div></div>`,
 `<div class="card" style="padding:20px;width:230px">${[80,55,70].map(w=>`<div style="display:flex;gap:10px;align-items:center;margin:7px 0"><div style="width:22px;height:22px;border-radius:6px;border:3px solid #c9cad1"></div><div style="height:12px;width:${w}%;background:#dcdee3;border-radius:8px"></div></div>`).join('')}</div>`,
 `<div class="card" style="padding:14px 26px;font-weight:700;font-size:26px;display:flex;gap:16px;align-items:center">Select… <span style="font-size:20px;color:#9a9ba3">▼</span></div>`,
 `<div class="card" style="width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center"><div class="spin" style="width:50px;height:50px;border-radius:50%;border:7px solid #eef0f3;border-top-color:#ff7a12"></div></div>`,
 `<div class="card" style="padding:12px 22px;font-weight:800;font-size:26px;background:#ff7a12;color:#fff;border-radius:40px">99+</div>`,
 `<div class="card" style="padding:22px;width:250px"><div style="height:10px;background:#dcdee3;border-radius:8px;position:relative"><div style="position:absolute;left:0;top:0;height:10px;width:35%;background:#ff1f7a;border-radius:8px"></div><div style="position:absolute;left:31%;top:-11px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3)"></div></div></div>`];
sc('B',FR.map((f,i)=>`<div class="a fr">${f}</div>`).join('')+`<div class="a" id="Bring" style="width:230px;height:230px;border-radius:50%;border:10px solid #ff1f7a;display:flex;align-items:center;justify-content:center"><span class="mono pk" style="font-size:26px;letter-spacing:.1em">teardown</span></div><div class="a" id="Bm">${GEM(120)}</div>`+txt('B1','Your product *works.*',104)+txt('B2',V?'But something|feels *off.*':'But something feels *off.*',104)+txt('B3','We find out *why.*',104));
// D: tiles on gradient
const TL=[['search','Diagnose','01 · Product Teardown'],['refresh','Refresh','02 · Interface Refresh Sprint'],['code','Build','03 · Web Experience'],['embed','Embed','04 · Embedded Designer']];
sc('D',txt('D1','One ladder.',120,'wh')+TL.map(x=>`<div class="a tl"><div class="tile">${ico(x[0],150,'#ff1f7a')}</div><div style="text-align:center;font-weight:800;font-size:54px;color:#fff;margin-top:34px;letter-spacing:-.03em">${x[1]}</div></div>`).join('')+`<div class="a mono wh" id="D2" style="font-size:28px"></div>`);
// E: conveyor pill
const EI=['search','eye','doc','code','refresh','hand','cal','check','embed','heart'];
sc('E',Array.from({length:14},(_,i)=>`<div class="a ev"><div class="evg" style="width:96px;height:96px;border-radius:50%;background:#e4e6eb;display:flex;align-items:center;justify-content:center;position:absolute;left:-48px;top:-48px">${ico(EI[i%10],50,'#9a9ba3')}</div><div class="evc ico3" style="width:96px;height:96px;border-radius:50%;position:absolute;left:-48px;top:-48px">${ico(EI[i%10],50)}</div></div>`).join('')+`<div class="a pill" id="Ep" style="height:150px;background:linear-gradient(90deg,#ff1f7a,#ff7a12);box-shadow:0 12px 0 #c2185b,0 40px 70px rgba(255,31,122,.4)"></div>`+['Map what users do','Redesign what matters','Hand over what ships'].map((s,i)=>`<div class="a t wh ept" style="font-size:66px;letter-spacing:-.03em">${s}</div>`).join('')+`<div class="a mono" id="E2" style="font-size:26px;color:#6a6b73">evidence before opinion</div>`);
// F: inline icon sentences
const FS=[['5','cal','days'],['R6,500','coin','fixed'],['in','doc','writing']];
sc('F',FS.map(f=>`<div class="a t fs" style="font-size:190px;display:flex;align-items:center;gap:.22em"><span class="fa">${f[0]}</span><span class="ico3 fi" style="width:1em;height:1em">${ico(f[1],110)}</span><span class="fb pk">${f[2]}</span></div>`).join('')+`<div class="a mono" id="F2" style="font-size:28px;color:#6a6b73">the product teardown</div>`);
// G: branch diagram
const GS=[['01','Product Teardown','5 days'],['02','Interface Refresh Sprint','2 weeks'],['03','Web Experience','6 – 8 weeks'],['04','Embedded Designer','ongoing']];
const GY=[-255,-85,85,255];
sc('G',`<svg class="a" id="Gsv" width="1080" height="1080" viewBox="-540 -540 1080 1080" style="overflow:visible"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#ff1f7a"/><stop offset="1" stop-color="#ff7a12"/></linearGradient></defs><path class="gp" d="M-900 0 L-330 0" fill="none" stroke="#16161a" stroke-width="7" stroke-linecap="round"/>${GY.map(y=>`<path class="gp" d="M-330 0 C-200 0 -210 ${y} -60 ${y}" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round"/>`).join('')}<circle id="Gn" cx="-330" cy="0" r="22" fill="#16161a"/>${GY.map(y=>`<circle class="gd" r="13" fill="#ff1f7a"/>`).join('')}</svg>`+GS.map((g,i)=>`<div class="a card gc" style="width:470px;padding:22px 28px;display:flex;align-items:center;gap:22px"><span class="ico3" style="width:78px;height:78px;font-weight:800;font-size:30px;color:#fff;flex:none">${g[0]}</span><div><div style="font-weight:800;font-size:33px;letter-spacing:-.03em;white-space:nowrap">${g[1]}</div><div class="mono" style="font-size:19px;color:#6a6b73;margin-top:4px">${g[2]}</div></div></div>`).join('')+txt('G1',V?'Climb only as far|as *you need.*':'Climb only as far as *you need.*',70));
// H: echo type on gradient
sc('H',Array.from({length:6},(_,i)=>`<div class="a t he" style="font-size:150px;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,${.55-i*.08})">under one roof.</div>`).join('')+txt('H1','Designed &amp; built',150,'wh')+`<div class="a t wh" id="H2" style="font-size:150px">under one roof.</div>`);
// I: typed pills
const IP=[['eye','Senior eyes on every screen'],['hand','Developer handoff, included'],['heart','30 days of aftercare']];
sc('I',IP.map(p=>`<div class="a pill ip" style="background:#16161a;color:#fff;padding:26px 52px 26px 30px;display:flex;align-items:center;gap:26px;font-weight:700;font-size:62px;letter-spacing:-.03em;box-shadow:0 30px 60px rgba(22,22,26,.3)"><span class="ico3" style="width:92px;height:92px;border-radius:50%;flex:none">${ico(p[0],52)}</span><span class="it"></span><span class="ic" style="width:5px;height:66px;background:#ff7a12;margin-left:-14px"></span></div>`).join('')+`<div class="a mono" id="I2" style="font-size:26px;color:#6a6b73">in every engagement</div>`);
// J: work deck
const WK=[['managem','ManaGEM','One record, enquiry to *invoice.*'],['wastemart','WasteMart','Six hours a week back, *per depot.*'],['sbs-waterproofing','SBS Waterproofing','In daily use *since 2015.*']];
sc('J',WK.map(w=>`<div class="a wc" style="width:640px;height:440px;border-radius:30px;overflow:hidden;box-shadow:0 14px 0 rgba(22,22,26,.12),0 50px 90px rgba(22,22,26,.3);background:#16161a"><img src="img/${w[0]}.jpg" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;left:22px;top:22px;background:#fff;border-radius:40px;padding:10px 24px;font-weight:800;font-size:28px;letter-spacing:-.02em">${w[1]}</div></div>`).join('')+WK.map((w,i)=>txt('J'+i,w[2],74)).join('')+`<div class="a mono" id="Jm" style="font-size:26px;color:#6a6b73">selected work &amp; evidence</div>`);
// K: statement + watermark
sc('K',`<div class="a" id="Kg">${GEM(900,'#ffe3ee','#ffeddc')}</div>`+txt('K1','Designers who',128)+txt('K2','answer to the *build.*',128));
// L: end
sc('L',`<div class="a" id="Lm">${GEM(210)}</div><div class="a" id="Lw" style="text-align:center"><div style="font-weight:800;font-size:128px;letter-spacing:.06em;line-height:1">GEMIS</div><div class="mono" style="font-size:32px;letter-spacing:.62em;margin:6px 0 0 .6em">Studio</div></div><div class="a pill" id="Lp" style="background:linear-gradient(90deg,#ff1f7a,#ff7a12);color:#fff;font-weight:800;font-size:54px;padding:30px 64px;letter-spacing:-.02em;box-shadow:0 10px 0 #c2185b,0 36px 60px rgba(255,31,122,.4)">Book a Teardown →</div><div class="a mono" id="L1" style="font-size:25px;color:#3a3b41;text-align:center;line-height:1.7">${V?"5 days · R6,500 excl. VAT<br>fee credited within 60 days":"5 days · R6,500 excl. VAT · fee credited within 60 days"}</div><div class="a mono" id="L2" style="font-size:25px;color:#6a6b73">gemis.co.za · info@gemis.co.za</div><div class="a" id="Lr" style="width:200px;height:200px;border-radius:50%;border:6px solid #ff1f7a"></div><svg class="a" id="Lc" width="72" height="72" viewBox="0 0 24 24" style="filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))"><path d="M4 2l15 9.2-6.6 1.500-3 6.500z" fill="#16161a" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>`);

const TM={A:[0,2.9],B:[2.6,8.9],D:[8.3,12.3],E:[12.0,16.0],F:[15.8,19.4],G:[19.2,23.6],H:[23.3,26.6],I:[26.3,30.2],J:[30.0,35.0],K:[34.8,38.0],L:[37.6,43.5]};
window.DUR=43.5;
const R={};
R.A=s=>{const d=E.sp(P(s,.15,.9)),u=E.sp(P(s,.3,.9));const g1=$('Am').querySelector('.g1'),g2=$('Am').querySelector('.g2');g1.style.transform=`translateY(${(1-d)*-70}px)`;g2.style.transform=`translateY(${(1-u)*70}px)`;g1.style.opacity=cl(P(s,.15,.2));g2.style.opacity=cl(P(s,.3,.2));
  const op=E.io(P(s,1.0,.7));const out=E.in(P(s,2.15,.5));const ww=560*op;
  T('Am',L(0,-330,op)*(1-out),0,{s:L(1,.82,op)*L(1,.46,out),r:(1-d)*-25+out*360});
  $('Aw').style.width=ww+'px';T('Aw',L(0,130,op),0,{o:1-P(s,2.1,.3)});$('Awi').style.transform=`translateX(${(1-op)*-120}px)`};
R.B=s=>{const gather=E.in(P(s,3.55,.85)),mess=P(s,1.7,1.5);const ringIn=E.sp(P(s,4.35,.7));
  $$('.fr').forEach((f,i)=>{const p=E.sp(P(s,.1+i*.09,.7));const a=i/9*6.283+s*(.5+gather*5)+(i%2?.35:0);const rx=(i%2?470:330)*(FMT=='h'?1.3:V?.72:1),ry=(i%2?215:150)*(FMT=='h'?1:V?1.55:1.5);
    const r=p*(1-gather);const x=Math.cos(a)*rx*r,y=(V?130:60)+Math.sin(a)*ry*r,d=(Math.sin(a)+1)/2;
    T(f,x+Math.sin(s*23+i*7)*7*mess,y+Math.cos(s*19+i*3)*7*mess,{s:L(.75,1.15,d)*p*(1-gather*.9),r:Math.sin(s*3+i)*5+Math.sin(s*27+i)*4*mess+gather*200,o:cl(p*2)*(1-gather),z:Math.round(d*10),b:(1-d)*2+gather*8})});
  $$('.spin').forEach(x=>x.style.transform=`rotate(${s*400}deg)`);
