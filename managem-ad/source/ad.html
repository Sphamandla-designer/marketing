<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), L=(a,b,p)=>a+(b-a)*p;
const E={out:x=>1-Math.pow(1-x,3),expo:x=>x>=1?1:1-Math.pow(2,-10*x),in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}};
const P=(t,a,d)=>cl((t-a)/d);
function T(el,str){el=$(el);el.innerHTML=str.split('|').map(line=>line.split(' ').map(w=>{const a=w[0]=='*';return `<span class="w${a?' acc':''}">${w.replace(/\*/g,'')}</span>`}).join(' ')).join('<br>')}
function kt(id,s,t0,tOut,o={}){const el=$(id),st=o.st??.09,d=o.d??.6;[...el.querySelectorAll('.w')].forEach((w,i)=>{
  const p=E.expo(P(s,t0+i*st,d)),q=tOut==null?0:E.in(P(s,tOut+i*.03,.32));
  w.style.opacity=(p*(1-q)).toFixed(3);w.style.transform=`translateY(${((1-p)*70-q*60).toFixed(1)}px) scale(${L(.92,1,p).toFixed(3)})`;
  const b=(1-p)*18+q*18;w.style.filter=b>.2?`blur(${b.toFixed(1)}px)`:'none'})}
function tf(el,o){(typeof el=='string'?$(el):el).style.transform=`translate3d(${o.x||0}px,${o.y||0}px,${o.z||0}px) rotateX(${o.rx||0}deg) rotateY(${o.ry||0}deg) rotateZ(${o.rz||0}deg) scale(${o.s??1})`}
function fx(el,o,b){el=typeof el=='string'?$(el):el;el.style.opacity=o;el.style.filter=b>.2?`blur(${b.toFixed(1)}px)`:'none'}
function star(sid,tid,x,y,ang,rot,sc,o){const s=$(sid);s.style.opacity=o;s.style.transform=`translate(${x-35}px,${y-35}px) rotate(${rot}deg) scale(${sc})`;
  if(tid){const tr=$(tid);tr.style.opacity=o*.9;tr.style.transform=`translate(${x-260}px,${y-5}px) rotate(${ang}deg)`}}
function cursor(cid,rid,x,y,click,o){const c=$(cid);c.style.opacity=o;const k=1-.18*Math.sin(Math.PI*cl(click*2.5));c.style.transform=`translate(${x}px,${y}px) scale(${k})`;
  const r=$(rid);r.style.opacity=click>0&&click<1?(1-click):0;r.style.transform=`translate(${x+6}px,${y+4}px) scale(${.3+click*1.3})`}

// text
T('s1a','Running a business');T('s1b',"shouldn't feel like *chaos.*");
T('s2a','Too many *tools.*');T('s2b','Spreadsheets. Paper. Chat groups. Guesswork.');
T('s3a','Meet');
T('s4a','Your whole business.|*One* *view.*');T('s4b','Enquiries. Quotes. Sales. *Live.*');
T('s5a','Handle');T('s5c','*in* *one* *place.*');
T('s6a','Track every *enquiry.*');T('s6b','Invoice in *seconds.*');T('s6c','Keep every project *on* *track.*');
T('s7d','All *connected.*');
T('s8a','Less admin.');T('s8b','Better decisions.');T('s8c','More *profit.*');
T('s9a',"Know what's making you *money.*");
const TAG="Know what's making you money.";
// chips
const CH=[['Spreadsheets','#22C55E'],['WhatsApp groups','#25D366'],['Paper quotes','#FBBF24'],['Sticky notes','#F59E0B'],['Email threads','#60A5FA'],['Job cards','#F472B6'],['Whiteboards','#A78BFA'],['Month-end exports','#38BDF8'],['Phone calls','#FB7185']];
$('chips').innerHTML=CH.map(c=>`<div class="chip"><i style="background:${c[1]}"></i>${c[0]}</div>`).join('');
const ROLL=['Customers','Sales','Projects','Stock','Factory','Debtors','everything'];
$('s5roll').innerHTML=ROLL.map(r=>`<div class="h rw" style="left:0;top:0;font-size:124px;color:#0F172A">${r}</div>`).join('');
const SBY={Customers:220,Sales:377,Projects:744,Stock:804,Factory:774,Debtors:684,everything:684};
$('pjs').innerHTML=[1,2,3,4,5,6].map(i=>`<img class="lift pj" src="img/pj${i}.png" style="left:-271px;top:-160px;width:542px">`).join('');

const SC=[['s1',0,3.5],['s2',3.3,8.15],['s3',8.0,11.3],['s4',11.1,17.0],['s5',16.8,22.0],['s6',21.8,29.3],['s7',29.1,33.4],['s8',33.2,37.3],['s9',37.1,43]];
const DUR=43;window.DUR=DUR;
const R={};
R.s1=s=>{kt('s1a',s,.15,1.35);kt('s1b',s,1.55,3.05);
  const p=P(s,.3,2.9),x=L(-100,2050,E.io(p)),y=330-Math.sin(p*Math.PI)*170+p*380;
  star('s1s','s1t',x,y,L(-22,38,p),s*220,1+.25*Math.sin(s*9),p>0&&p<1?1:0)};
R.s2=s=>{kt('s2a',s,.25,3.9);kt('s2b',s,1.3,3.9,{st:.16});
  const gather=E.in(P(s,3.75,.75));
  [['r1',300],['r2',430],['r3',560]].forEach(([id,r],i)=>{const k=E.expo(P(s,.1+i*.12,.9))*(1-gather);const e=$(id);e.style.left=(960-r*k)+'px';e.style.top=(520-r*k*.42)+'px';e.style.width=(2*r*k)+'px';e.style.height=(2*r*k*.42)+'px';e.style.opacity=k});
  const ob=E.back(P(s,0,.6));tf('orb',{s:ob*(1+.35*gather)+0.03*Math.sin(s*5)});
  [...$('chips').children].forEach((c,i)=>{const p=E.expo(P(s,.45+i*.14,.7));const ring=i%2?560:400;const a=i/CH.length*Math.PI*2+s*(.55+gather*4)+(i%2?.4:0);
    const r=ring*p*(1-gather),x=960+Math.cos(a)*r,y=520+Math.sin(a)*r*.42,d=(Math.sin(a)+1)/2,sc=L(.74,1.1,d)*p*(1-gather*.8);
    c.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${sc.toFixed(3)})`;c.style.opacity=p*(1-gather)*L(.8,1,d);c.style.zIndex=Math.round(d*10);
    const b=(1-p)*10+gather*14+(1-d)*1.2;c.style.filter=`blur(${b.toFixed(1)}px)`});
  $('orb').style.zIndex=5;
  const f=E.in(P(s,4.2,.5));$('flash').style.opacity=cl(f*1.6);$('flash').style.transform=`scale(${1+f*16})`};
R.s3=s=>{kt('s3a',s,.15,.95);
  const p=E.expo(P(s,1.05,.8));const lg=$('s3logo');lg.style.opacity=p;lg.style.transform=`scale(${L(1.7,1,p)})`;lg.style.filter=`blur(${((1-p)*26).toFixed(1)}px)`;
  const q=E.back(P(s,1.55,.6));const n=Math.floor(cl((s-1.85)/.9)*TAG.length);$('s3tag').textContent=TAG.slice(0,n)+(n<TAG.length&&s>1.8?'|':'');
  const w=L(110,790,E.io(P(s,1.75,.95)));const pl=$('s3pill');pl.style.width=w+'px';pl.style.marginLeft=(-w/2)+'px';pl.style.opacity=cl(q);pl.style.transform=`scale(${q})`};
R.s4=s=>{const a=E.expo(P(s,.1,1.9)),b=E.io(P(s,3.0,1.1));
