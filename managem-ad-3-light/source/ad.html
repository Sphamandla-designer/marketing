.card b i{display:inline-block;width:16px;height:16px;border-radius:50%;background:#00C9A7;box-shadow:0 0 12px rgba(0,201,167,.8);margin-right:14px;vertical-align:middle}

.star{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px}
.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#14B8A6}

<script>
const $=id=>document.getElementById(id),$$=q=>[...document.querySelectorAll(q)];
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),L=(a,b,p)=>a+(b-a)*p;
const E={out:x=>1-Math.pow(1-x,3),expo:x=>x>=1?1:1-Math.pow(2,-10*x),in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back:x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}};
const P=(t,a,d)=>cl((t-a)/d);
const tf=(el,o)=>{(typeof el=='string'?$(el):el).style.transform=`translate3d(${o.x||0}px,${o.y||0}px,${o.z||0}px) rotateX(${o.rx||0}deg) rotateY(${o.ry||0}deg) rotateZ(${o.rz||0}deg) scale(${o.s??1})`};

// ---------- format ----------
const FMT=(location.hash||'#v').slice(1);
const F={v:{W:1080,H:1920,k:1,tx:0,ty:0,oty:140,otx:0,cap:{left:60,width:960,top:1440,size:86,align:'center'}},
         s:{W:1080,H:1080,k:.6,tx:216,ty:-65,oty:48,otx:216,cap:{left:50,width:980,top:800,size:66,align:'center'}},
         h:{W:1920,H:1080,k:.74,tx:960,ty:-47,oty:-67,otx:560,cap:{left:110,width:800,top:null,size:96,align:'left'}}}[FMT];
window.SIZE=[F.W,F.H];document.documentElement.style.width=document.body.style.width=F.W+'px';document.documentElement.style.height=document.body.style.height=F.H+'px';
$$('.stage').forEach(st=>{const o=st.parentElement.id=='sF';st.style.transform=`translate(${o?F.otx:F.tx}px,${o?F.oty:F.ty}px) scale(${F.k})`});
$$('.b1').forEach(b=>{b.style.cssText+=`width:${F.W*.8}px;height:${F.W*.8}px;background:#8FEBDD;opacity:.36`});
$$('.b2').forEach(b=>{b.style.cssText+=`width:${F.W*.7}px;height:${F.W*.7}px;background:#A5DBFF;opacity:.36`});
const cap=$('cap');cap.style.left=F.cap.left+'px';cap.style.width=F.cap.width+'px';cap.style.fontSize=F.cap.size+'px';cap.style.textAlign=F.cap.align;

// ---------- timing (seconds, matched to the voice-over) ----------
const SC=[['sA',5.1],['sB',4.8],['sC',9.2],['sD',5.8],['sE',4.5],['sF',7.5]];
const LEAD=[.6,.35,.4,.4,.3,.9];
let acc=0;const ST=SC.map(s=>{const a=acc;acc+=s[1];return a});window.DUR=acc;
const W=window.WORDS;
[[0,.02],[1,.43],[2,.83],[3,1.6],[4,2.0],[5,2.54],[6,2.81],[7,3.19],[8,3.51],[9,3.84]].forEach(([i,t])=>W[3][i][1]=t);
// caption groups: [line, firstWord, lastWord, accentFirst, accentLast]
const G=[[0,0,4,4,4],[0,5,10,9,9],[1,0,1,1,1],[1,2,7,6,6],[2,0,3,3,3],[2,4,9,8,9],[2,10,12,12,12],[2,13,16,15,16],[3,0,4,3,4],[3,5,9,8,9],[4,0,1,1,1],[4,2,3,3,3],[4,4,5,5,5]];
G.forEach((g,i)=>{const [l,a,b]=g;g.t0=ST[l]+LEAD[l]+W[l][a][1]-.12;const nx=G[i+1];g.t1=(nx&&nx[0]==l)?ST[nx[0]]+LEAD[nx[0]]+W[nx[0]][nx[1]][1]-.16:Math.min(ST[l]+SC[l][1]-.05,ST[l]+LEAD[l]+W[l][b][1]+1.25)});
const wt=(l,i)=>ST[l]+LEAD[l]+W[l][i][1];

// ---------- build ----------
const RC=[['Customers','c_customers'],['Quotes','c_quotes'],['Invoices','c_invoices'],['Projects','c_projects'],['Stock','c_stock'],['Factory','c_factory'],['Debtors','c_debtors'],['Reports','c_reports']];
const RR=760;
$('ring').innerHTML=RC.map((c,i)=>`<div class="card" style="transform:rotateY(${i*45}deg) translateZ(${RR}px)"><b><i></i>${c[0]}</b><img src="img/${c[1]}.jpg"></div>`).join('');
$('halo').innerHTML=Array.from({length:8},(_,i)=>`<div class="abs hd" style="left:756px;top:756px;width:22px;height:22px;margin:-11px;border-radius:50%;background:#00C9A7;box-shadow:0 0 18px #00C9A7"></div>`).join('');
const RT=[0,1,3,4,5,8,10,12].map(i=>LEAD[2]+W[2][i][1]);const FIN=LEAD[2]+W[2][13][1];
$('phT').innerHTML=Array.from({length:12},(_,i)=>`<div class="abs" style="left:-215px;top:-466px;width:430px;height:932px;border-radius:64px;background:${i==11?'#3a4354':'#7b889c'};transform:translateZ(${-(i+1)*2.2}px)"></div>`).join('');
$('base').insertAdjacentHTML('beforeend',Array.from({length:6},(_,i)=>`<div class="abs" style="width:900px;height:620px;border-radius:10px 10px 34px 34px;background:#9aa4b1;transform:translateZ(${-(i+1)*3}px)"></div>`).join(''));
const BH=[150,230,200,330,420,390,560],BW=92,BD=92,GAP=40;
$('ch').innerHTML=BH.map((h,i)=>{const x=(i-3)*(BW+GAP)-BW/2;return `<div class="abs p3 bar" style="left:${x}px;top:0;transform-origin:50% 0">
 <div class="abs" style="width:${BW}px;height:${h}px;top:${-h}px;background:linear-gradient(180deg,#14C9AE,#0EA5E9);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);transform:translateZ(${BD/2}px)"></div>
 <div class="abs" style="width:${BD}px;height:${h}px;top:${-h}px;left:${BW-BD/2}px;background:linear-gradient(180deg,#0B8FA8,#075985);transform:rotateY(90deg)"></div>
 <div class="abs" style="width:${BW}px;height:${BD}px;top:${-h-BD/2}px;background:#9FF3E6;box-shadow:inset 0 0 0 2px #fff;transform:rotateX(90deg)"></div></div>`}).join('');
const pulse=(id,n)=>{$(id).innerHTML=Array.from({length:n},()=>`<div class="abs pr" style="width:900px;height:900px;margin:-450px;border-radius:50%;border:3px solid rgba(13,148,136,.5)"></div>`).join('')};pulse('pulB',3);pulse('pulF',3);
const DN=22;$('dots').innerHTML=Array.from({length:DN},()=>'<div class="dot"></div>').join('');
const rnd=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
const pulses=(id,s,sp)=>{[...$(id).children].forEach((r,i)=>{const p=((s*sp+i/3)%1+1)%1;r.style.transform=`scale(${.3+p*1.5})`;r.style.opacity=(1-p)*.8})};
const twinkle=(sel,s,pos)=>{$$(sel).forEach((st,i)=>{const [x,y]=pos[i];const k=Math.max(0,Math.sin(s*2.6+i*2.1));st.style.transform=`translate(${x}px,${y}px) rotate(${s*90+i*40}deg) scale(${k*1.3})`;st.style.opacity=k})};

// ---------- scenes (s = seconds since scene start) ----------
const R={};
R.sA=s=>{const op=E.io(P(s,.25,1.5)),on=P(s,1.1,.5);
  tf('lap',{y:L(140,0,E.out(P(s,0,1.6))),z:L(-500,-120,E.out(P(s,0,4.9))),rx:L(-26,-14,E.out(P(s,0,3))),ry:L(-38,22,E.io(P(s,0,5)))});
  $('lid').style.transform=`rotateX(${L(-90,12,op)}deg)`;$('lscr').style.opacity=on;
  const q0=LEAD[0]+W[0][5][1];$$('.ca').forEach((c,i)=>{const q=E.back(P(s,q0+i*.35,.5));c.style.opacity=cl(q);c.style.transform=`translate3d(0,${(1-cl(q))*60+Math.sin(s*2.2+i*2)*10}px,${120+i*50}px) scale(${L(.5,1,q)})`})};
